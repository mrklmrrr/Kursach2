# Деплой бекенда Med24 (REST + Socket.IO) для iOS и веба в интернете.
# Dashboard: https://dashboard.render.com → New → Blueprint → репозиторий Kursach2
services:
  - type: web
    name: med24
    runtime: node
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: JWT_SECRET
        sync: false
      - key: MONGO_URI
        sync: false
      - key: JWT_EXPIRES_IN
        value: 30d
      - key: FRONTEND_URL
        value: https://med24-nine.vercel.app,http://localhost:5173,https://med24-ly9x.onrender.com
      - key: PUBLIC_API_BASE
        value: https://med24-ly9x.onrender.com
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
